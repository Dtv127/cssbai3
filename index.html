<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thẻ khóa học - CSS thuần</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Lộ trình ôn tập CSS</h1>
    <div class="cards">
      <div class="card">
        <span class="badge">Cơ bản</span>
        <h2>Box Model</h2>
        <p>Căn lề, đệm trong, viền và kích thước phần tử gọn gàng.</p>
      </div>
      <div class="card">
        <span class="badge">Bố cục</span>
        <h2>Flexbox</h2>
        <p>Xếp các khối ngang hàng, chia đều không gian và tự xuống dòng.</p>
      </div>
      <div class="card">
        <span class="badge">Tương tác</span>
        <h2>Hover &amp; Transition</h2>
        <p>Tạo hiệu ứng nổi thẻ và đổi màu mượt mà khi di chuột.</p>
      </div>
    </div>
  </div>
</body>
</html>
